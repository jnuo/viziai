name: E2E Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright's browser install does not support yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # e2e seeds and deletes test users/profiles, so it must never point at production.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_STAGING }}
      NEXTAUTH_SECRET: e2e-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Guard e2e database (refuse production)
        env:
          PROD_URL: ${{ secrets.NEON_DATABASE_URL_PROD }}
        run: |
          e2e_host=$(node -e 'console.log(new URL(process.env.NEON_DATABASE_URL).host)')
          prod_host=$(node -e 'console.log(new URL(process.env.PROD_URL).host)')
          if [ -z "$e2e_host" ] || [ "$e2e_host" = "$prod_host" ]; then
            echo "::error::e2e database is missing or is production; refusing to run"
            exit 1
          fi
          echo "::add-mask::$e2e_host"
          echo "E2E_DB_HOST_ALLOW=$e2e_host" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
